<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Login | The Kings Cheats</title>
<style>
  body { background: #0a0a0c; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
  .login-box { background: #141419; padding: 40px; border-radius: 12px; border: 1px solid #2a2a35; width: 300px; text-align: center; box-shadow: 0 0 20px rgba(255, 215, 0, 0.1); }
  h2 { color: #ffd700; margin-bottom: 20px; }
  input { width: 100%; padding: 12px; margin-bottom: 15px; background: #0a0a0c; border: 1px solid #2a2a35; color: #fff; border-radius: 6px; box-sizing: border-box; }
  input:focus { outline: none; border-color: #ffd700; }
  button { width: 100%; padding: 12px; background: #ffd700; color: #000; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: 0.2s; }
  button:hover { background: #e6c200; transform: translateY(-2px); }
  .error { color: #ff4444; font-size: 13px; margin-bottom: 15px; }
</style>
</head>
<body>
  <div class="login-box">
    <h2>The Kings Cheats</h2>
    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}
    <form method="POST">
      <input type="text" name="username" placeholder="Usuario" required>
      <input type="password" name="password" placeholder="Contraseña" required>
      <button type="submit">Entrar al Panel</button>
    </form>
  </div>
</body>
</html>
